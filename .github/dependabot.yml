version: 2
updates:
  # npm workspaces are updated from the root lockfile
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - "dependency-updates"
    versioning-strategy: increase
    allow:
      - dependency-type: "production"
    assignees: [zachleat]

  - package-ecosystem: github-actions
    directories: [".github/workflows/**"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [zachleat]
